name: skp_kiosk
description: Smart Kiosk Platform — Windows kiosk client
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: 3.0.0
  http: ^1.3.0
  path: ^1.9.1
  uuid: ^4.5.1
  webview_windows: ^0.4.0
  printing: ^5.14.3
  flutter_libserialport: ^0.6.0
  media_kit: ^1.2.0
  media_kit_video: ^1.3.0
  media_kit_libs_windows_video: ^1.0.11
  pdf: ^3.12.0
  camera: ^0.11.2
  camera_windows: ^0.2.6
  image: ^4.5.4
  http_parser: ^4.1.2
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
