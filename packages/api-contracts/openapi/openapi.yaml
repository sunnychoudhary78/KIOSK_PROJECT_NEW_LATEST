openapi: 3.0.3
info:
  title: Smart Kiosk Platform API
  version: 1.0.0
  description: |
    Source-of-truth OpenAPI contract for Smart Kiosk Platform.
    Versioned under /v1. Principals: citizen, admin, device.

    DigiLocker OAuth callback is mounted outside this prefix at
    GET /api/v1/auth/digilocker/callback (exact MeriPehchaan registered redirect).
    Access tokens stay server-side; kiosks poll session status and download print PDFs via device JWT.
servers:
  - url: http://localhost:3000/v1
    description: Local
tags:
  - name: Health
  - name: Identity
  - name: Devices
  - name: Services
  - name: OtpPrint
  - name: Payments
  - name: DigiLocker
  - name: Printing
  - name: Audit
  - name: PlatformSettings
  - name: Astrology
paths:
  /health:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/citizen/otp-request:
    post:
      tags: [Identity]
      summary: Request citizen login OTP via SMS
      operationId: citizenOtpRequest
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitizenOtpRequest'
      responses:
        '200':
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitizenOtpRequestResponse'

  /auth/citizen/otp-verify:
    post:
      tags: [Identity]
      summary: Verify citizen login OTP and issue JWT
      operationId: citizenOtpVerify
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitizenOtpVerifyRequest'
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /auth/citizen/login:
    post:
      tags: [Identity]
      summary: Deprecated password login (gone)
      operationId: citizenLogin
      deprecated: true
      security: []
      responses:
        '410':
          description: Password login removed; use OTP login

  /auth/admin/login:
    post:
      tags: [Identity]
      summary: Admin login
      operationId: adminLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminLoginRequest'
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /auth/device/token:
    post:
      tags: [Identity]
      summary: Exchange device credentials for access token
      operationId: deviceToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequest'
      responses:
        '200':
          description: Device token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /devices:
    get:
      tags: [Devices]
      summary: List devices (admin)
      operationId: listDevices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Device list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
    post:
      tags: [Devices]
      summary: Register a kiosk device (admin)
      operationId: registerDevice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDeviceRequest'
      responses:
        '201':
          description: Device registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegistrationResponse'

  /devices/nearby:
    get:
      tags: [Devices]
      summary: List nearest active kiosks for a citizen
      operationId: listNearbyDevices
      security:
        - bearerAuth: []
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Nearby devices sorted by distance
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NearbyDevice'

  /devices/{deviceId}/heartbeat:
    post:
      tags: [Devices]
      summary: Device heartbeat
      operationId: deviceHeartbeat
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                type: object
                required: [surveillanceEnabled]
                properties:
                  surveillanceEnabled:
                    type: boolean

  /devices/{deviceId}/status:
    patch:
      tags: [Devices]
      summary: Stop or start a kiosk (admin, operator)
      operationId: setDeviceStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, inactive]
      responses:
        '200':
          description: Updated device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'

  /devices/{deviceId}/surveillance:
    patch:
      tags: [Devices]
      summary: Start or stop local surveillance recording on a kiosk (admin, operator)
      operationId: setDeviceSurveillance
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: Updated device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'

  /devices/{deviceId}/surveillance/segments/upload-url:
    post:
      tags: [Devices]
      summary: Issue a short-lived presigned PUT URL for a local surveillance segment
      operationId: createSurveillanceUploadUrl
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurveillanceUploadUrlRequest'
      responses:
        '200':
          description: Presigned PUT URL (or alreadyUploaded if the object is already stored)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveillanceUploadUrlResponse'
        '403':
          description: Device JWT does not match path deviceId
        '503':
          description: Object storage is not configured

  /devices/{deviceId}/surveillance/segments:
    get:
      tags: [Devices]
      summary: List uploaded surveillance segments for a kiosk on a UTC calendar day (admin, operator, viewer)
      operationId: listSurveillanceSegments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: recordedOn
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: UTC calendar day (YYYY-MM-DD)
      responses:
        '200':
          description: Uploaded segments for that day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveillanceSegmentListResponse'
        '404':
          description: Device not found

  /devices/{deviceId}/surveillance/segments/{segmentId}/playback-url:
    get:
      tags: [Devices]
      summary: Issue a short-lived presigned GET URL to play an uploaded segment (admin, operator, viewer)
      operationId: createSurveillancePlaybackUrl
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: segmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Presigned GET URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveillancePlaybackUrlResponse'
        '404':
          description: Segment not found for this device
        '409':
          description: Segment is not uploaded yet
        '503':
          description: Object storage is not configured

  /devices/{deviceId}/surveillance/segments/{segmentId}/complete:
    post:
      tags: [Devices]
      summary: Confirm a surveillance segment landed in object storage
      operationId: completeSurveillanceSegment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - name: segmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Segment marked uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveillanceCompleteResponse'
        '400':
          description: Uploaded object size does not match
        '409':
          description: Object was not found in storage

  /services:
    get:
      tags: [Services]
      summary: List platform services
      operationId: listServices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Service catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformService'

  /services/{serviceCode}/enablement:
    put:
      tags: [Services]
      summary: Enable or disable a service for a device
      operationId: setServiceEnablement
      security:
        - bearerAuth: []
      parameters:
        - name: serviceCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceEnablementRequest'
      responses:
        '200':
          description: Enablement updated

  /astrology/readings:
    post:
      tags: [Astrology]
      summary: Create a Vedic chart plus palm reading from a kiosk palm photo
      operationId: createAstrologyReading
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [palm, name, gender, dateOfBirth, birthTime, birthPlace]
              properties:
                palm:
                  type: string
                  format: binary
                  description: JPEG, PNG, or WebP palm photo (max 5 MB)
                name:
                  type: string
                  maxLength: 80
                gender:
                  type: string
                  enum: [male, female, other]
                dateOfBirth:
                  type: string
                  format: date
                birthTime:
                  type: string
                  description: HH:mm, 24-hour. Use 12:00 when unknown.
                  example: '14:20'
                birthPlace:
                  type: string
                  example: Jaipur, Rajasthan
                birthTimeUnknown:
                  type: string
                  enum: ['true', 'false']
      responses:
        '201':
          description: Structured reading
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AstrologyReadingResponse'
        '400':
          description: Validation failed
        '403':
          description: Service disabled for this device
        '502':
          description: VedAstro or OpenAI failed

  /otp-challenges:
    post:
      tags: [OtpPrint]
      summary: Upload PDFs and create OTP print challenge (citizen)
      operationId: createOtpChallenge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                documentLabel:
                  type: string
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '201':
          description: Challenge created. OTP is SMS'd only when payment is not required, or after successful payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeResponse'

  /otp-challenges/redeem:
    post:
      tags: [OtpPrint]
      summary: Redeem OTP at kiosk (device)
      operationId: redeemOtpChallenge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemOtpRequest'
      responses:
        '200':
          description: OTP redeemed; print job and document download paths ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedeemOtpResponse'

  /otp-challenges/{challengeId}:
    get:
      tags: [OtpPrint]
      summary: Get OTP print session for the owning citizen (poll after payment)
      operationId: getOtpChallenge
      security:
        - bearerAuth: []
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Challenge status, quote, and OTP-sent flag
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeResponse'

  /otp-challenges/{challengeId}/resend-otp:
    post:
      tags: [OtpPrint]
      summary: Resend print OTP after a successful payment if SMS failed
      operationId: resendOtpChallenge
      security:
        - bearerAuth: []
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OTP send attempted
          content:
            application/json:
              schema:
                type: object
                required: [otpSent]
                properties:
                  otpSent:
                    type: boolean
                  alreadyIssued:
                    type: boolean

  /otp-challenges/{challengeId}/documents/{documentId}/content:
    get:
      tags: [OtpPrint]
      summary: Download redeemed OTP document PDF (device)
      operationId: getOtpDocumentContent
      security:
        - bearerAuth: []
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: documentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: PDF bytes
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /payments/razorpay/order:
    post:
      tags: [Payments]
      summary: Create or reuse a Razorpay order for extra print pages (citizen)
      operationId: createRazorpayOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRazorpayOrderRequest'
      responses:
        '201':
          description: Order created or reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RazorpayOrderResponse'

  /payments/razorpay/verify:
    post:
      tags: [Payments]
      summary: Verify Razorpay Checkout signature and issue print OTP
      operationId: verifyRazorpayPayment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRazorpayPaymentRequest'
      responses:
        '200':
          description: Payment fulfilled; OTP SMS sent when possible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RazorpayVerifyResponse'

  /payments/razorpay/webhook:
    post:
      tags: [Payments]
      summary: Razorpay webhook (raw body HMAC). No JWT.
      operationId: razorpayWebhook
      security: []
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string

  /platform-settings:
    get:
      tags: [PlatformSettings]
      summary: List platform settings (admin)
      operationId: listPlatformSettings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Settings list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformSetting'

  /platform-settings/{settingKey}:
    put:
      tags: [PlatformSettings]
      summary: Update a platform setting (admin)
      operationId: updatePlatformSetting
      security:
        - bearerAuth: []
      parameters:
        - name: settingKey
          in: path
          required: true
          schema:
            type: string
            enum: [sms_config, otp_print_config, citizen_auth_config]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlatformSettingRequest'
      responses:
        '200':
          description: Updated setting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSetting'

  /digilocker/sessions:
    post:
      tags: [DigiLocker]
      summary: Start DigiLocker OAuth session (device) — returns pending + authorizationUrl
      operationId: startDigiLockerSession
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartDigiLockerSessionRequest'
      responses:
        '201':
          description: Session started (pending until OAuth callback)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigiLockerSessionResponse'

  /digilocker/sessions/{sessionId}:
    get:
      tags: [DigiLocker]
      summary: Poll DigiLocker session status (device)
      operationId: getDigiLockerSession
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session status for kiosk polling
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigiLockerSessionResponse'

  /digilocker/sessions/{sessionId}/cancel:
    post:
      tags: [DigiLocker]
      summary: Cancel a DigiLocker session and drop stored OAuth tokens (device)
      operationId: cancelDigiLockerSession
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session marked expired; tokens cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DigiLockerSessionResponse'

  /digilocker/sessions/{sessionId}/documents:
    get:
      tags: [DigiLocker]
      summary: List documents for DigiLocker session
      operationId: listDigiLockerDocuments
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Document list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DigiLockerDocument'

  /digilocker/sessions/{sessionId}/print:
    post:
      tags: [DigiLocker]
      summary: Create print job from DigiLocker document
      operationId: printDigiLockerDocument
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrintDigiLockerRequest'
      responses:
        '201':
          description: Print job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintJob'

  /print-jobs:
    get:
      tags: [Printing]
      summary: List print jobs (admin)
      operationId: listPrintJobs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Print jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PrintJob'

  /print-jobs/{jobId}:
    get:
      tags: [Printing]
      summary: Get print job
      operationId: getPrintJob
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Print job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintJob'

  /print-jobs/{jobId}/status:
    patch:
      tags: [Printing]
      summary: Update print job status (device)
      operationId: updatePrintJobStatus
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePrintJobStatusRequest'
      responses:
        '200':
          description: Updated job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrintJob'

  /print-jobs/{jobId}/content:
    get:
      tags: [Printing]
      summary: Download print job PDF content (device)
      operationId: getPrintJobContent
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: PDF bytes (tokens stay server-side; DigiLocker file fetched by API)
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /audit-logs:
    get:
      tags: [Audit]
      summary: List audit logs (admin)
      operationId: listAuditLogs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    ErrorEnvelope:
      type: object
      required: [code, message, correlationId]
      properties:
        code:
          type: string
        message:
          type: string
        correlationId:
          type: string

    HealthResponse:
      type: object
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        version:
          type: string

    CitizenOtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          type: string

    CitizenOtpRequestResponse:
      type: object
      required: [message, expiresAt]
      properties:
        message:
          type: string
        expiresAt:
          type: string
          format: date-time
        devOtp:
          type: string
          description: Present only in local/dev/test when SMS is noop

    CitizenOtpVerifyRequest:
      type: object
      required: [phone, otp]
      properties:
        phone:
          type: string
        otp:
          type: string

    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    DeviceTokenRequest:
      type: object
      required: [deviceKey, deviceSecret]
      properties:
        deviceKey:
          type: string
        deviceSecret:
          type: string

    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, principalType]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
        principalType:
          type: string
          enum: [citizen, admin, device]
        refreshToken:
          type: string
        deviceId:
          type: string
          format: uuid
          description: Present when principalType is device
        deviceName:
          type: string
          description: Present when principalType is device
        surveillanceEnabled:
          type: boolean
          description: Present when principalType is device

    Device:
      type: object
      required: [id, name, deviceKey, status, siteName, surveillanceEnabled]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        deviceKey:
          type: string
        status:
          type: string
          enum: [active, inactive, provisioning]
        siteName:
          type: string
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        address:
          type: string
          nullable: true
        lastHeartbeatAt:
          type: string
          format: date-time
          nullable: true
        surveillanceEnabled:
          type: boolean
          description: When true, the kiosk records local surveillance segments

    SurveillanceUploadUrlRequest:
      type: object
      required: [filename, bytes, recordedOn]
      properties:
        filename:
          type: string
          description: Basename of the finalized MP4 (no path separators)
        bytes:
          type: integer
          format: int64
          minimum: 1
        contentType:
          type: string
          enum: [video/mp4]
          default: video/mp4
        recordedOn:
          type: string
          description: UTC calendar day of the segment folder (YYYY-MM-DD)
          pattern: '^\d{4}-\d{2}-\d{2}$'

    SurveillanceUploadUrlResponse:
      type: object
      required: [segmentId, objectKey]
      properties:
        segmentId:
          type: string
          format: uuid
        objectKey:
          type: string
        uploadUrl:
          type: string
          format: uri
          description: Presigned PUT URL. Omitted when alreadyUploaded is true.
        expiresAt:
          type: string
          format: date-time
        alreadyUploaded:
          type: boolean

    SurveillanceCompleteResponse:
      type: object
      required: [ok, status]
      properties:
        ok:
          type: boolean
        status:
          type: string
          enum: [pending_upload, uploaded]

    SurveillanceSegmentListItem:
      type: object
      required: [id, filename, recordedOn, startedAt, byteSize]
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        recordedOn:
          type: string
          description: UTC calendar day (YYYY-MM-DD)
          pattern: '^\d{4}-\d{2}-\d{2}$'
        startedAt:
          type: string
          format: date-time
          description: UTC segment start parsed from the HHmmss_ filename
        byteSize:
          type: integer
          format: int64
        uploadedAt:
          type: string
          format: date-time
          nullable: true

    SurveillanceSegmentListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SurveillanceSegmentListItem'

    SurveillancePlaybackUrlResponse:
      type: object
      required: [url, expiresAt]
      properties:
